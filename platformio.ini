[env:nanoatmega328new]
platform = atmelavr
board = nanoatmega328new
framework = arduino

; Configuração das bibliotecas
lib_deps =
    miguelbalboa/MFRC522 @ ^1.4.11
    arduino-libraries/LiquidCrystal @ ^1.0.7